# Postgres real do Supabase. Nenhuma credencial fica hardcoded aqui --
# preencha as variaveis de ambiente antes de subir com este perfil:
#   SUPABASE_DB_URL      jdbc:postgresql://<host>:5432/postgres
#   SUPABASE_DB_USERNAME
#   SUPABASE_DB_PASSWORD
spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  h2:
    console:
      enabled: false
